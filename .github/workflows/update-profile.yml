name: Update GitHub profile stats

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/generate_github_stats.py
      - .github/workflows/update-profile.yml
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Generate animated charts from GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/generate_github_stats.py

      - name: Commit updated stats when data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity.svg assets/github-summary.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub activity dashboard"
            git push
          fi
