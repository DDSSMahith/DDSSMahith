    <path d="M765 434h27" stroke="#39DCAC" stroke-width="2"/><text x="802" y="438" fill="#D8EFF7" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1.2">TECHNOLOGY FOCUS</text>
    <text x="765" y="458" fill="#7596A9" font-family="Consolas,monospace" font-size="9" letter-spacing=".8">CONCEPT MAP  ·  NO PERCENTAGES IMPLIED</text>
