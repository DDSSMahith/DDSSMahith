    <circle cx="836" cy="511" r="38" stroke="#35E4FF" stroke-width="11" stroke-dasharray="67 172" stroke-dashoffset="0" transform="rotate(-90 836 511)"/>
    <circle cx="836" cy="511" r="38" stroke="#A28AFF" stroke-width="11" stroke-dasharray="46 193" stroke-dashoffset="-71" transform="rotate(-90 836 511)"/>
    <circle cx="836" cy="511" r="38" stroke="#49E0AC" stroke-width="11" stroke-dasharray="42 197" stroke-dashoffset="-121" transform="rotate(-90 836 511)"/>
