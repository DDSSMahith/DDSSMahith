    <text x="45" y="594" fill="#7698AA" font-family="Consolas,monospace" font-size="9" letter-spacing=".7">DESIGNED FOR THE PROFILE README  <tspan fill="#2C596B">/</tspan>  CUSTOM SVG  <tspan fill="#2C596B">/</tspan>  CYAN SIGNAL SERIES</text>
    <text x="1154" y="594" text-anchor="end" fill="#66899C" font-family="Consolas,monospace" font-size="9">DDSSMAHITH</text>
