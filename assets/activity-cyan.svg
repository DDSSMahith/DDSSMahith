    <g><use href="#cube" x="119" y="357"/><use href="#cube" x="174" y="320"/><use href="#cube" x="230" y="347"/><use href="#cube" x="274" y="331"/><use href="#cube" x="308" y="370"/><use href="#cube" x="362" y="343"/><use href="#cube" x="400" y="382"/><use href="#cube" x="440" y="369"/><use href="#cube" x="482" y="359"/><use href="#cube" x="528" y="400"/><use href="#cube" x="584" y="420"/>
      <use href="#cube" x="194" y="356"/><use href="#cube" x="330" y="353"/><use href="#cube" x="462" y="346"/><use href="#cube" x="551" y="368"/></g>
    <g opacity=".78"><use href="#cube" x="292" y="328"/><use href="#cube" x="423" y="381"/><use href="#cube" x="504" y="369"/><use href="#cube" x="536" y="411"/></g>
    </g>
    <text x="60" y="535" fill="#91AEBE" font-family="Consolas,monospace" font-size="10" letter-spacing="1">MODEL  <tspan fill="#D8F2F8">ACTIVITY SHAPE STUDY</tspan></text>
    <path d="M495 530h206" stroke="#56EFFF" stroke-opacity=".18"/><circle cx="504" cy="543" r="3" fill="#2D879E"/><circle cx="518" cy="543" r="3" fill="#49B8D0"/><circle cx="532" cy="543" r="3" fill="#65EEFF"/><text x="543" y="547" fill="#769BAC" font-family="Consolas,monospace" font-size="9">LOW  ·  MID  ·  HIGH</text>

    <!-- capability radar -->
    <rect x="747" y="141" width="419" height="242" rx="14" fill="url(#panel)" stroke="#67DDED" stroke-opacity=".17"/>
    <path d="M765 178h27" stroke="#A58BFF" stroke-width="2"/><text x="802" y="182" fill="#D8EFF7" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1.2">CAPABILITY RADAR</text>
    <text x="765" y="202" fill="#7596A9" font-family="Consolas,monospace" font-size="9" letter-spacing=".8">ILLUSTRATIVE PROFILE  ·  NOT A MEASURED SCORE</text>
