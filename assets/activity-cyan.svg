      <text x="0" y="-91" text-anchor="middle" fill="#BFD3DF" font-family="Consolas,monospace" font-size="9">ML</text><text x="84" y="-23" fill="#BFD3DF" font-family="Consolas,monospace" font-size="9">VISION</text><text x="51" y="78" fill="#BFD3DF" font-family="Consolas,monospace" font-size="9">WEB</text><text x="-65" y="78" fill="#BFD3DF" font-family="Consolas,monospace" font-size="9">AUTOMATION</text><text x="-119" y="-23" fill="#BFD3DF" font-family="Consolas,monospace" font-size="9">DATA</text>
    </g>

