      <circle cx="911" cy="514" r="4" fill="#49E0AC"/><text x="923" y="518">FULL-STACK</text><circle cx="1054" cy="514" r="4" fill="#F1C877"/><text x="1066" y="518">AUTOMATION</text>
      <circle cx="911" cy="540" r="4" fill="#476475"/><text x="923" y="544">DATA / CLOUD / TOOLS</text>
