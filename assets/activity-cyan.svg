<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Mahith — signal atlas</title>
  <desc id="desc">A futuristic cyan dashboard with a decorative isometric activity terrain, an illustrative capability radar, and a conceptual technology focus donut. Charts are visual artwork, not live GitHub statistics.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="24" x2="1150" y2="604" gradientUnits="userSpaceOnUse"><stop stop-color="#0B1420"/><stop offset=".55" stop-color="#080F19"/><stop offset="1" stop-color="#07111B"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101E2C" stop-opacity=".9"/><stop offset="1" stop-color="#0B1520" stop-opacity=".75"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8AFAFF"/><stop offset=".5" stop-color="#29E6FF"/><stop offset="1" stop-color="#00A8D5"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D6C6FF"/><stop offset="1" stop-color="#8D72F9"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A6FFE2"/><stop offset="1" stop-color="#38D8A5"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#19384B"/><stop offset="1" stop-color="#102536"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#53F5FF"/><stop offset="1" stop-color="#087BA7"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#00CFFF" stop-opacity=".2"/><stop offset="1" stop-color="#00CFFF" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#88DDF2" fill-opacity=".12"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="13"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="608" rx="24"/></clipPath>
    <clipPath id="terrain"><rect x="47" y="207" width="670" height="320" rx="7"/></clipPath>
    <g id="cube"><path d="M0 7 10 1l10 6-10 6L0 7Z" fill="#48F0FF"/><path d="M0 7 10 13v12L0 19V7Z" fill="#167B9B"/><path d="m10 13 10-6v12l-10 6V13Z" fill="#239FBD"/></g>
    <g id="cubeLow"><path d="M0 7 10 1l10 6-10 6L0 7Z" fill="#194558"/><path d="M0 7 10 13v7L0 14V7Z" fill="#102A3B"/><path d="m10 13 10-6v7l-10 6v-7Z" fill="#14374A"/></g>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="610" rx="24" fill="url(#bg)"/><rect width="1200" height="610" fill="url(#dots)"/>
    <ellipse cx="340" cy="310" rx="470" ry="320" fill="url(#glow)"/>
    <rect x="1" y="1" width="1198" height="608" rx="24" stroke="#62EFFF" stroke-opacity=".45" stroke-width="2"/>
    <path d="M26 116h1148" stroke="#74DAF5" stroke-opacity=".16"/>
    <path d="M27 28h32M27 28v32M1173 28h-32M1173 28v32M27 582h32M27 582v-32M1173 582h-32M1173 582v-32" stroke="#56EFFF" stroke-opacity=".48" stroke-width="2"/>
    <circle cx="43" cy="46" r="4" fill="#54F6FF"/><circle cx="43" cy="46" r="8" stroke="#54F6FF" stroke-opacity=".28"/>
    <text x="64" y="48" fill="#68F4FF" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="3.2">SIGNAL ATLAS <tspan fill="#829EB3">/ 001</tspan></text>
    <text x="64" y="91" fill="#E6F3FC" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="650" letter-spacing=".2">MAHITH</text>
    <text x="244" y="89" fill="#99B5C9" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2.4">AI  /  MACHINE LEARNING  /  PRODUCT ENGINEERING</text>
    <rect x="914" y="37" width="238" height="42" rx="8" fill="#10202C" stroke="#35DAF0" stroke-opacity=".3"/>
    <circle cx="932" cy="58" r="4" fill="#56EDC3"/><text x="946" y="62" fill="#B6CEDD" font-family="Consolas,monospace" font-size="11" letter-spacing="1">ILLUSTRATIVE DATA VIZ</text>

    <!-- Isometric activity terrain -->
    <rect x="35" y="141" width="695" height="416" rx="14" fill="url(#panel)" stroke="#67DDED" stroke-opacity=".17"/>
    <path d="M53 178h34" stroke="#5FEFFF" stroke-width="2"/><text x="97" y="182" fill="#D8EFF7" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1.3">CONTRIBUTION TERRAIN</text>
    <text x="53" y="203" fill="#7596A9" font-family="Consolas,monospace" font-size="10" letter-spacing="1">ISOMETRIC RENDER  ·  DECORATIVE PREVIEW</text>
    <rect x="492" y="160" width="216" height="25" rx="12" fill="#0D2C3A" stroke="#2E8295" stroke-opacity=".6"/><circle cx="506" cy="172.5" r="3" fill="#56EDC3"/><text x="516" y="176" fill="#8EB6C4" font-family="Consolas,monospace" font-size="9" letter-spacing=".7">NOT LIVE GITHUB ACTIVITY</text>
    <g clip-path="url(#terrain)">
    <ellipse cx="380" cy="397" rx="255" ry="103" fill="#00CFFF" fill-opacity=".08" filter="url(#shadow)"/>
    <!-- A receding rhombus lattice gives the contribution field its isometric base. -->
    <path d="M120 345 304 240 667 450 483 555Z" fill="#0D1C29" fill-opacity=".54" stroke="#89DFF0" stroke-opacity=".3" stroke-width="1"/>
    <g stroke="#89DFF0" stroke-opacity=".18" stroke-width=".8">
      <path d="M156 366 340 261M193 387 377 282M229 408 413 303M265 429 449 324M302 450 486 345M338 471 522 366M374 492 558 387M410 513 594 408M447 534 631 429"/>
